name: Controlled release guard

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-guard:
    name: Release readiness guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Validate release readiness before publication
        run: python scripts/check_release_readiness.py --format json

      - name: No publication is enabled
        run: echo "No publication step is enabled until controlled release prerequisites are complete."
