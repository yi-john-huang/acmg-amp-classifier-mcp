name: Platform package smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    name: Package smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          version: "0.7.22"

      - name: Install the frozen dependency graph
        run: uv sync --frozen --all-groups

      - name: Run clean package smoke
        run: uv run --frozen --no-sync pytest --no-cov tests/packaging/test_package_smoke.py -q

      - name: Record platform evidence metadata
        run: uv run --frozen --no-sync python -c "import platform, sys; print({'platform': platform.platform(), 'python': sys.version, 'package_smoke': 'passed'})"
