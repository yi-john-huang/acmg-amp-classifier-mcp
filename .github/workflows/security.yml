name: Security gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Locked Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.7.22"
      - name: Audit the locked runtime dependency set
        run: |
          uv export --locked --no-dev --format requirements-txt --no-emit-project -o /tmp/runtime-requirements.txt
          uvx --from "pip-audit==2.9.0" pip-audit --strict --requirement /tmp/runtime-requirements.txt

  secret-scan:
    name: Fail-closed local secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history for scanning
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.7.22"
      - name: Scan all tracked repository content against reviewed baseline
        run: |
          git ls-files -z | xargs -0 uvx --from "detect-secrets==1.5.0" detect-secrets-hook --baseline .secrets.baseline
