name: Synthetic benchmark evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-evidence:
    name: Retain synthetic benchmark evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          version: "0.7.22"

      - name: Install the frozen dependency graph
        run: uv sync --frozen --all-groups

      - name: Generate synthetic benchmark report
        run: uv run --frozen --no-sync python scripts/run_benchmark_evidence.py --output "$RUNNER_TEMP/benchmark.json"

      - name: Show report summary
        run: cat "$RUNNER_TEMP/benchmark.json"

      - name: Retain synthetic report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-benchmark-evidence
          path: ${{ runner.temp }}/benchmark.json
          retention-days: 90

      - name: State live-performance boundary
        run: echo "Synthetic evidence does not establish live performance or release readiness."
