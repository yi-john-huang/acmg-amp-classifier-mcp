# Run with: docker compose run --rm acmg-mcp
# MCP is a stdio protocol; this service intentionally publishes no network ports.
services:
  acmg-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: acmg-classifier:local
    init: true
    stdin_open: true
    tty: false
    volumes:
      - acmg_data:/data

volumes:
  acmg_data:
